# Nombre de la aplicacion
spring.application.name=ProyectoSecurizar

# ==============================================================
# CONEXION A LA BASE DE DATOS MYSQL (DOCKER)
# ==============================================================
spring.datasource.url=jdbc:mysql://localhost:3307/BonillaYSpringBoot?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=usuario_spring
spring.datasource.password=password_segura
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================================================
# CONFIGURACION DE JPA / HIBERNATE
# ==============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true